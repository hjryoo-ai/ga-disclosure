# ExternalSecret 템플릿(값 없음). 파드가 받는 Secret 이름은 기반 매니페스트와 같다 — 앱·잡은 ga-db-app·ga-s3·ga-secrets, 마이그레이션 Job만 ga-db-migrator.
---
# DB 롤 넷(앱·헬스·테넌트 디렉터리·작업 잠금) — 환경(envFrom). 마이그레이터는 여기 없다
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ga-db-app
  namespace: ga-disclosure
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: ga-secret-store }
  target:
    name: ga-db-app
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DISCLOSURE_APP_USER
      remoteRef: { key: db/app, property: user }
    - secretKey: DISCLOSURE_APP_PASSWORD
      remoteRef: { key: db/app, property: password }
    - secretKey: DISCLOSURE_HEALTH_USER
      remoteRef: { key: db/health, property: user }
    - secretKey: DISCLOSURE_HEALTH_PASSWORD
      remoteRef: { key: db/health, property: password }
    - secretKey: DISCLOSURE_OPERATOR_USER
      remoteRef: { key: db/operator, property: user }
    - secretKey: DISCLOSURE_OPERATOR_PASSWORD
      remoteRef: { key: db/operator, property: password }
    - secretKey: DISCLOSURE_JOB_LOCK_USER
      remoteRef: { key: db/job_lock, property: user }
    - secretKey: DISCLOSURE_JOB_LOCK_PASSWORD
      remoteRef: { key: db/job_lock, property: password }
---
# 마이그레이터(스키마 소유자) — db migrate Job에만
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ga-db-migrator
  namespace: ga-disclosure
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: ga-secret-store }
  target:
    name: ga-db-migrator
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DISCLOSURE_MIGRATOR_USER
      remoteRef: { key: db/migrator, property: user }
    - secretKey: DISCLOSURE_MIGRATOR_PASSWORD
      remoteRef: { key: db/migrator, property: password }
---
# 봉인 산출물 저장소(Object Lock 버킷은 인프라가 만든다 — 앱은 만들지 않는다)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ga-s3
  namespace: ga-disclosure
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: ga-secret-store }
  target:
    name: ga-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GA_S3_ACCESS_KEY_ID
      remoteRef: { key: s3/app, property: access-key-id }
    - secretKey: GA_S3_SECRET_ACCESS_KEY
      remoteRef: { key: s3/app, property: secret-access-key }
---
# 파일 비밀(ga.secrets.dir) — 테넌트 KEK·엔진 토큰은 테넌트마다 한 줄(KEK 등록 런북이 이 목록과 볼륨 items를 함께 늘린다). TENANT_A는 예시
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ga-secrets
  namespace: ga-disclosure
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: ga-secret-store }
  target:
    name: ga-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api.cursor
      remoteRef: { key: files/api/cursor, property: value }
    - secretKey: api.request-hash
      remoteRef: { key: files/api/request-hash, property: value }
    - secretKey: api.customer-receipt
      remoteRef: { key: files/api/customer-receipt, property: value }
    - secretKey: tsa.trust-anchors.pem
      remoteRef: { key: files/tsa/trust-anchors.pem, property: value }
    - secretKey: backup.key
      remoteRef: { key: files/backup/key, property: value }
    - secretKey: kek.TENANT_A.TENANT_A-KEK-1
      remoteRef: { key: files/kek/TENANT_A/TENANT_A-KEK-1, property: value }
    - secretKey: engine.TENANT_A
      remoteRef: { key: files/engine/TENANT_A, property: value }
---
# 내부 진입점 C의 클라이언트 인증서 CA(공개 인증서 — mTLS 검증용)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ga-internal-client-ca
  namespace: ga-disclosure
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: ga-secret-store }
  target:
    name: ga-internal-client-ca
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ca.crt
      remoteRef: { key: pki/internal-client-ca, property: certificate }
---
# 진입점 서버 인증서(staff)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ga-tls-staff
  namespace: ga-disclosure
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: ga-secret-store }
  target:
    name: ga-tls-staff
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef: { key: pki/staff, property: certificate }
    - secretKey: tls.key
      remoteRef: { key: pki/staff, property: private-key }
---
