apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ga-secret-store
  namespace: ga-disclosure
spec:
  provider:
    vault:
      server: https://vault.example.invalid
      path: ga-disclosure
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ga-disclosure
          serviceAccountRef:
            name: ga-secret-reader
---
# 비밀 저장소 인증 전용(파드는 쓰지 않는다 — 앱·잡 SA는 토큰 자동 마운트 끔)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ga-secret-reader
  namespace: ga-disclosure
automountServiceAccountToken: false
