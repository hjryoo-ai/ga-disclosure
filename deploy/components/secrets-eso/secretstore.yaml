# 비밀 저장소 연결은 네임스페이스마다 하나(SecretStore는 네임스페이스 리소스 — 앱 네임스페이스의 비밀과 인그레스 네임스페이스의 TLS·CA를 다른 역할로 읽는다).
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ga-secret-store
  namespace: ga-disclosure
spec:
  provider:
    vault:
      server: https://vault.example.invalid
      path: ga-disclosure
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ga-disclosure
          serviceAccountRef:
            name: ga-secret-reader
---
# 비밀 저장소 인증 전용(파드는 쓰지 않는다)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ga-secret-reader
  namespace: ga-disclosure
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ga-secret-store
  namespace: ga-ingress
spec:
  provider:
    vault:
      server: https://vault.example.invalid
      path: ga-disclosure
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ga-ingress
          serviceAccountRef:
            name: ga-secret-reader
---
# 비밀 저장소 인증 전용(파드는 쓰지 않는다)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ga-secret-reader
  namespace: ga-ingress
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ga-secret-store
  namespace: ga-ingress-internal
spec:
  provider:
    vault:
      server: https://vault.example.invalid
      path: ga-disclosure
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ga-ingress-internal
          serviceAccountRef:
            name: ga-secret-reader
---
# 비밀 저장소 인증 전용(파드는 쓰지 않는다)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ga-secret-reader
  namespace: ga-ingress-internal
automountServiceAccountToken: false
