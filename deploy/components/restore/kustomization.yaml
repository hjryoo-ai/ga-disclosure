# 복구(Phase 8 ⑤, G2 kind 판 — 자동화 증명은 RestoreProofIT): 정기 백업(ga-backup)의 실행 하나를 빈 볼륨의 PostgreSQL과 새 산출물 버킷으로 되살린다.
#   ga-postgres 준비 컨테이너 restore(app 이미지 CLI, 앱 컨텍스트 없이): 데이터 디렉터리가 비어 있을 때만 — 백업 저장소에서 봉투 → 백업 키로 열기 → tar 풀기.
#     PostgreSQL은 그 디렉터리로 뜬다(initdb·초기화 스크립트 없음 — 롤·비밀번호 해시도 백업에서 온다: 복구 환경의 비밀 저장소가 같은 비밀번호를 가져야 한다).
#   Job ga-restore-objects: 같은 실행의 산출물 모든 버전 → 산출물 버킷(비어 있어야 한다 — 오버레이가 새 버킷 이름을 준다).
# 실행 이름과 복구 버킷은 ConfigMap ga-restore(GA_RESTORE_RUN·GA_S3_BUCKET — 복구 스크립트가 실행마다 새 버킷 이름으로 만든다). 앱·작업 파드는 ga-app-config 뒤에
# ga-restore를 읽어 그 버킷을 쓴다(뒤의 envFrom이 이긴다). 백업 자격(ga-backup-s3·backup/key)은 이 둘에만(deploy 린트).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - restore-objects.yaml
patches:
  - target: { kind: StatefulSet, name: ga-postgres }
    path: postgres-restore.yaml
  # SeaweedFS는 복구 준비 컨테이너(ga-postgres 파드)의 백업 저장소 읽기를 받는다
  - target: { kind: Deployment, name: ga-app }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value: { configMapRef: { name: ga-restore } }
  - target: { kind: CronJob, labelSelector: app.kubernetes.io/name=ga-job }
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/envFrom/-
        value: { configMapRef: { name: ga-restore } }
  - target: { kind: NetworkPolicy, name: ga-seaweedfs }
    patch: |-
      - op: add
        path: /spec/ingress/0/from/0/podSelector/matchExpressions/0/values/-
        value: ga-postgres
      - op: add
        path: /spec/ingress/0/from/0/podSelector/matchExpressions/0/values/-
        value: ga-restore-objects
