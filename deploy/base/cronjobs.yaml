# CronJob = JobKind 전수 1:1(Phase 8 ③ — deploy 린트가 JobKind ↔ 이 파일을 양방향으로 대조한다). 모두 Asia/Seoul·concurrencyPolicy Forbid·
# startingDeadlineSeconds·backoffLimit·activeDeadlineSeconds. Forbid는 같은 CronJob의 겹침만 막는다 — 수동 create job --from·복제된 CronJob·
# 다른 클러스터의 겹침은 앱의 테넌트×종류 advisory 잠금이 막는다(jobs run → 같은 작업 실행기, 바쁜 테넌트는 JOB_BUSY·종료 2).
# 주기 없는 종류는 suspend: true(런북의 kubectl create job --from=cronjob/<이름> 원형). 명령은 app 이미지의 CLI(cli 프로파일 + 오버레이 프로파일).
---
# ANCHOR: 플랫폼 배치 — 모든 테넌트를 한 루트로(테넌트별 아님, 6A Q7)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ga-job-anchor
  labels:
    app.kubernetes.io/name: ga-job
    app.kubernetes.io/part-of: ga-disclosure
    ga/job-kind: ANCHOR
spec:
  schedule: "20 0 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  suspend: false
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: ga-job
        ga/job-kind: ANCHOR
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ga-job
            ga/job-kind: ANCHOR
        spec:
          serviceAccountName: ga-jobs
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: job
              image: ga-disclosure/app:dev
              imagePullPolicy: IfNotPresent
              args: ["--spring.profiles.active=cli,$(GA_PROFILE)", "anchor", "run", "--tenants", "all", "--operator", "cronjob"]
              env:
                - name: GA_PROFILE
                  valueFrom: { configMapKeyRef: { name: ga-app-config, key: SPRING_PROFILES_ACTIVE } }
                - { name: GA_SECRETS_DIR, value: /var/run/ga-secrets }
                - { name: GA_SECRETS_ALLOW_GROUP_READ, value: "true" }
              envFrom:
                - configMapRef: { name: ga-app-config }
                - secretRef: { name: ga-db-app }
                - secretRef: { name: ga-s3 }
              resources:
                requests: { cpu: 100m, memory: 512Mi }
                limits: { memory: 1Gi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
                - { name: ga-secrets, mountPath: /var/run/ga-secrets, readOnly: true }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 128Mi }
            - name: ga-secrets
              secret:
                secretName: ga-secrets
                defaultMode: 0440
---
