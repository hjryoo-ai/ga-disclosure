# 마이그레이션 = 선행 Job(Phase 8 "마이그레이션 분리"): app 이미지의 운영자 명령 db migrate(앱 컨텍스트 없이). 마이그레이터 자격 증명(ga-db-migrator)은
# 이 Job에만 마운트한다. 앱 파드는 스키마 버전 가드가 jar의 최고 V*와 DB를 대조할 때까지 준비되지 않는다 — 배포 순서는 이 Job 완료 → rollout.
apiVersion: batch/v1
kind: Job
metadata:
  name: ga-db-migrate
  labels:
    app.kubernetes.io/name: ga-db-migrate
    app.kubernetes.io/part-of: ga-disclosure
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ga-db-migrate
    spec:
      serviceAccountName: ga-migrate
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ga-disclosure/app:dev
          imagePullPolicy: IfNotPresent
          args: ["db", "migrate"]
          env:
            - name: DISCLOSURE_DB_URL
              valueFrom: { configMapKeyRef: { name: ga-app-config, key: DISCLOSURE_DB_URL } }
          envFrom:
            - secretRef: { name: ga-db-migrator }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
