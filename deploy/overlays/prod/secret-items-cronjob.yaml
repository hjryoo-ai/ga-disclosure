# 볼륨 순서: tmp(0)·ga-secrets(1) — deploy 린트가 렌더 결과의 모든 ga-secrets 볼륨에 items가 있는지 본다
- op: add
  path: /spec/jobTemplate/spec/template/spec/volumes/1/secret/items
  value:
    - { key: api.cursor, path: api/cursor }
    - { key: api.request-hash, path: api/request-hash }
    - { key: api.customer-receipt, path: api/customer-receipt }
    - { key: tsa.trust-anchors.pem, path: tsa/trust-anchors.pem }
    - { key: backup.key, path: backup/key }
    - { key: kek.TENANT_A.TENANT_A-KEK-1, path: kek/TENANT_A/TENANT_A-KEK-1 }
    - { key: engine.TENANT_A, path: engine/TENANT_A }
