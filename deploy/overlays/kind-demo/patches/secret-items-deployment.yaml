# 볼륨 순서: tmp(0)·ga-secrets(1). kind 데모 테넌트 DEMO1·DEMO2·DEMO3의 첫 KEK — 회전(11단계)은 스크립트가 줄을 더한다. 키는 kind-secrets.sh가 만든다.
- op: add
  path: /spec/template/spec/volumes/1/secret/items
  value:
    - { key: api.cursor, path: api/cursor }
    - { key: api.request-hash, path: api/request-hash }
    - { key: api.customer-receipt, path: api/customer-receipt }
    - { key: backup.key, path: backup/key }
    - { key: demo.oidc-signing, path: demo/oidc-signing }
    - { key: demo.tsa-stub.p12, path: demo/tsa-stub.p12 }
    - { key: kek.DEMO1.DEMO1-KEK-1, path: kek/DEMO1/DEMO1-KEK-1 }
    - { key: kek.DEMO2.DEMO2-KEK-1, path: kek/DEMO2/DEMO2-KEK-1 }
    - { key: kek.DEMO3.DEMO3-KEK-1, path: kek/DEMO3/DEMO3-KEK-1 }
