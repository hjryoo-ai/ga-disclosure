# 화면 서빙(Phase 8 ③ — 데모 프로파일의 DemoWebConfiguration을 운영에서 대신한다). 경로·헤더는 그 구성과 같다:
#   GET/HEAD만, 경로는 /·/staff·/staff/**(직원 화면)·/s(고객 서명)·/oidc-callback·/assets/*(해시 이름) — 그 밖은 404(본문 없음)
#   CSP(인라인·외부 출처 0)·Referrer-Policy no-referrer·nosniff·프레임 DENY, HTML no-store, 자산 1년 public immutable
# add_header는 location 안에서 다시 쓰면 위의 것을 잇지 않으므로 공통 헤더를 include 대신 각 location에 같은 문자열로 둔다(이미지 시험이 응답을 대조).
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 404;
    }

    location = / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        types { }
        default_type "text/html;charset=UTF-8";
        try_files /staff/index.html =404;
    }
    location = /staff {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        types { }
        default_type "text/html;charset=UTF-8";
        try_files /staff/index.html =404;
    }
    location ^~ /staff/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        types { }
        default_type "text/html;charset=UTF-8";
        try_files /staff/index.html =404;
    }
    location = /s {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        types { }
        default_type "text/html;charset=UTF-8";
        try_files /sign/index.html =404;
    }
    location = /oidc-callback {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
        types { }
        default_type "text/html;charset=UTF-8";
        try_files /oidc-callback/index.html =404;
    }
    # 해시 이름 자산(한 단계 — 하위 디렉터리 없음, 데모의 /assets/* 패턴과 같다)
    location ~ ^/assets/[^/]+$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "max-age=31536000, public, immutable" always;
        # 자산 형식은 닫힌 표(이미지 시험이 빌드 산출물의 확장자 전수와 대조). nginx 기본 표에는 .mjs가 없어 PDF.js 모듈 워커가 application/octet-stream
        # + nosniff로 거부됐다 — 서명 화면이 문서를 그리지 못했다(11단계 kind E2E에서 발견, 로컬 E2E는 앱이 서빙해 드러나지 않았다)
        types {
            text/javascript js mjs;
            text/css css;
            font/ttf ttf;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
