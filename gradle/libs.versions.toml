# 버전 정책 (CLAUDE.md 코드 규약)
# - Spring Boot BOM이 관리하는 라이브러리(Flyway·JUnit·Testcontainers·AssertJ·Jackson·PostgreSQL 드라이버 등)는
#   여기에 버전을 적지 않고 BOM(spring-boot-dependencies)에 위임한다.
# - BOM 밖의 라이브러리만 버전을 고정한다. 확인 출처와 일자는 docs/phase-00-보고서.md.
# - net.jqwik은 어떤 경로로도 해석되면 빌드가 실패한다(루트 build.gradle.kts, CLAUDE.md 절대 규칙 9).

[versions]
java = "25"
spring-boot = "4.1.1"
archunit = "1.5.1"
json-schema-validator = "3.0.6"  # 3.0.7은 Jackson 3.2.1을 요구해 Boot BOM(3.1.5)을 끌어올린다 → BOM 호환 최신판
jcs = "1.1"                     # RFC 8785 JCS. 후보 중 유일하게 RFC 벡터 전부 통과, 런타임 의존 0 (docs/phase-01-계획.md)
postgres-image = "postgres:18.6"
seaweedfs-image = "chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d"  # 4.48, digest 고정(3B 승인 Q1) — 하네스·compose와 같아야 한다
awssdk = "2.55.9"               # S3 어댑터(3B 승인 Q12). Boot BOM 밖 — 2026-10-01 Maven Central 최신. url-connection-client만 쓴다
openhtmltopdf = "1.1.87"         # HTML→PDF/A 렌더러(LGPL-2.1, PDFBox 3.0.7 전이 — 3A 실측 조합 그대로, 3.0.8 상향은 골든 갱신 사유와 함께)
nodejs = "24.21.0"               # disclosure-web(Phase 7): Node LTS(Krypton) — node-gradle 플러그인이 내려받아 고정. npm은 동봉판(11.19.0)
node-gradle = "7.1.0"            # com.github.node-gradle.node — Gradle 플러그인 포털 최신(2026-10-10)
bouncycastle = "1.86"            # RFC 3161 TSA 토큰 생성(스텁)·검증(4 수용심사 승인 ①). Boot BOM 밖 — 2026-10-03 Maven Central 최신, OSV 0건. Bouncy Castle Licence(MIT 계열)

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# BOM 밖 — 버전 고정
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jcs = { module = "io.github.erdtman:java-json-canonicalization", version.ref = "jcs" }
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awssdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }
awssdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }
testcontainers = { module = "org.testcontainers:testcontainers" }
openhtmltopdf-pdfbox = { module = "io.github.openhtmltopdf:openhtmltopdf-pdfbox", version.ref = "openhtmltopdf" }
bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }

# BOM 관리 — 버전 없음
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-dataformat-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-tx = { module = "org.springframework:spring-tx" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
# Phase 8 G8: 관리 포트의 /actuator/prometheus (Boot BOM 관리 버전)
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
logback-classic = { module = "ch.qos.logback:logback-classic" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
