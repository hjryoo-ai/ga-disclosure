spring:
  application:
    name: ga-disclosure
  # 요청 본문의 모르는 필드는 400(6B §9 승인 R1): 계약이 additionalProperties: false를 약속한다 — 조용히 버리지 않는다(스프링 부트 기본은 무시).
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  # 애플리케이션 데이터소스: disclosure_app (NOBYPASSRLS, DML만). 테넌트는 트랜잭션마다 TenantSessionBinder가 설정한다.
  datasource:
    url: ${DISCLOSURE_DB_URL:jdbc:postgresql://localhost:5432/disclosure}
    username: ${DISCLOSURE_APP_USER:disclosure_app}
    password: ${DISCLOSURE_APP_PASSWORD:app_local_only}

# 테넌트 디렉터리(운영자 CLI --tenants all 전용): tenant.tenant_id만 읽을 수 있는 disclosure_operator 롤(V4, 설계서 §9).
ga:
  tenant-directory:
    url: ${DISCLOSURE_DB_URL:jdbc:postgresql://localhost:5432/disclosure}
    username: ${DISCLOSURE_OPERATOR_USER:disclosure_operator}
    password: ${DISCLOSURE_OPERATOR_PASSWORD:operator_local_only}
  # (Phase 8) 마이그레이션: 앱은 기동 때 마이그레이션하지 않는다. 운영자 명령 db migrate만 disclosure_migrator(스키마 소유자)로 접속한다 —
  # 운영은 마이그레이션 Job에만 이 자격 증명을 마운트한다. 앱 기동은 스키마 버전 가드(헬스 롤)를 지나야 한다.
  migrator:
    url: ${DISCLOSURE_DB_URL:jdbc:postgresql://localhost:5432/disclosure}
    username: ${DISCLOSURE_MIGRATOR_USER:disclosure_migrator}
    password: ${DISCLOSURE_MIGRATOR_PASSWORD:migrator_local_only}
  # (Phase 8, V22) 헬스·스키마 버전 가드: flyway_schema_history (version, success)만 읽는 disclosure_health 롤로 풀 없이 연결한다.
  health:
    url: ${DISCLOSURE_DB_URL:jdbc:postgresql://localhost:5432/disclosure}
    username: ${DISCLOSURE_HEALTH_USER:disclosure_health}
    password: ${DISCLOSURE_HEALTH_PASSWORD:health_local_only}
  # 작업 잠금(6A, 승인 Q8): 테이블 권한이 없는 disclosure_job_lock 롤로 잠금마다 풀 없이 연결한다(세션 advisory lock — 연결이 끝나면 풀린다).
  job-lock:
    url: ${DISCLOSURE_DB_URL:jdbc:postgresql://localhost:5432/disclosure}
    username: ${DISCLOSURE_JOB_LOCK_USER:disclosure_job_lock}
    password: ${DISCLOSURE_JOB_LOCK_PASSWORD:job_lock_local_only}
  # (Phase 8) 서버 비밀의 출처 — 테넌트 KEK(kek/{T}/{T}-KEK-n)·…. 쿠버네티스는 Secret 볼륨 마운트, 로컬은 저장소 밖 디렉터리(소유자 전용).
  # 비어 있으면 비밀이 필요한 순간 실패한다. allow-group-read는 Secret 볼륨(fsGroup)용.
  secrets:
    dir: ${GA_SECRETS_DIR:}
    allow-group-read: ${GA_SECRETS_ALLOW_GROUP_READ:false}
  # 봉인 산출물 저장소(Phase 3B): 표준 S3 API + Object Lock. 기본값은 로컬 compose의 SeaweedFS와 허구 키(docker/seaweedfs/s3.json) —
  # 운영은 배포 설정으로 덮는다. create-bucket은 개발·데모 전용(운영 버킷은 인프라가 Object Lock 활성으로 만든다).
  storage:
    s3:
      endpoint: ${GA_S3_ENDPOINT:http://localhost:8333}
      region: ${GA_S3_REGION:us-east-1}
      bucket: ${GA_S3_BUCKET:ga-disclosure-local}
      access-key-id: ${GA_S3_ACCESS_KEY_ID:ga-local-access}
      secret-access-key: ${GA_S3_SECRET_ACCESS_KEY:ga-local-secret-not-a-real-key}
      path-style: true
      create-bucket: ${GA_S3_CREATE_BUCKET:false}
  # 봉인 트랜잭션 제한 시간(잔여물 정리 유예는 이보다 커야 한다)
  seal:
    transaction-timeout: PT60S

# 오류 응답(6A 계획 §5.5): 화이트라벨 끔, 예외·메시지·스택·바인딩 오류를 응답에 싣지 않는다, 요청 상세(헤더·질의)를 로그에 남기지 않는다.
# 공개 서명 응답 하한 ga.public-sign.min-response-millis는 기본값이 없다(승인 Q6) — 웹 모드 배포 설정이 정한다.
server:
  error:
    whitelabel:
      enabled: false
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring.mvc.log-request-details: false
# 요청 원문(요청 줄·헤더·본문 앞부분)이나 원 URI(질의 포함)를 DEBUG/TRACE로 찍는 프레임워크 로거는 INFO로 고정한다(6A G6) — 운영자가 문제를 보려고
# 루트 수준을 올려도 서명 토큰(헤더 X-Sign-Token, 잘못 보낸 질의·경로)·본문의 생년월일이 로그에 가지 않는다. 이 로거를 따로 내리는 것은 명시적 결정이다.
logging:
  level:
    org.apache.coyote: INFO
    org.apache.catalina: INFO
    org.apache.tomcat: INFO
    org.springframework.security.web.FilterChainProxy: INFO

# (Phase 8, G7) 관리 포트 분리 — 헬스는 이 포트에서만(인그레스 미노출, NetworkPolicy는 kubelet·모니터링만). 앱 포트의 /actuator/**는 없는 경로와
# 같은 404다. 준비성 = DB(헬스 롤)·저장소(Object Lock)·IdP JWKS, 활성 = 프로세스만.
management:
  server:
    port: ${GA_MANAGEMENT_PORT:8082}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,database,storage,idpJwks
        liveness:
          include: livenessState
  health:
    # 트랜잭션 밖 DB 접근 금지(CLAUDE.md 절대 규칙 5) — DB 헬스 지표는 테넌트 없이 커넥션을 쓰므로 끈다.
    db:
      enabled: false
