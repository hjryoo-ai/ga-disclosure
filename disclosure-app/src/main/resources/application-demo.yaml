# 데모 프로파일(6A 계획 §10). 웹 데모(http-demo.sh)는 데모 OIDC 발급자(DemoOidcIssuer, `demo token`)가 내보낸 공개키 PEM으로 JWT를 검증한다 —
# 발급자 ga-demo, 대상 ga-disclosure. 운영 프로파일은 ga.api.jwt.jwk-set-uri(IdP)이고 이 파일을 읽지 않는다. 키·PEM은 저장소 밖(~/.ga-disclosure)과
# gitignore된 build/demo에만 있다. 공개 서명 응답 하한과 목록 커서 키·멱등 요청 해시 키도 데모 값이다(운영은 배포 설정).
ga:
  api:
    jwt:
      issuer: ga-demo
      audience: ga-disclosure
      public-key-location: ${ga.demo.oidc-public-pem:build/demo/demo-oidc.pem}
  # (Phase 8) 비밀 — 테넌트 KEK·API 키·데모 OIDC 서명 키 — 은 비밀 디렉터리에서 읽는다(`secrets init --demo yes`·`crypto kek init`이 만든다, 앱은 만들지 않는다)
  secrets:
    dir: ${GA_SECRETS_DIR:${user.home}/.ga-disclosure/secrets}
  public-sign:
    min-response-millis: 250
  # Phase 7 데모 로그인(DemoLoginController, Q6): 직원 화면의 주체 선택 폼에 보이는 계정(테넌트/주체) — 닫힌 목록, 역할은 identity_link.
  demo:
    login:
      accounts:
        - DEMO1/demo-agent
        - DEMO1/demo-manager
        - DEMO1/demo-compliance
        - DEMO1/demo-compliance-2
        - DEMO2/demo-agent
        - DEMO2/demo-manager
        - DEMO2/demo-compliance
        - DEMO2/demo-compliance-2
