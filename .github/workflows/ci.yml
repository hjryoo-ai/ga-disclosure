name: ci

on:
  push:
    branches: [main]
    tags: ['phase-*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # ubuntu 러너에는 Docker가 있다. 통합 테스트(Testcontainers)는 Docker가 없으면 실패한다(스킵 금지).
    runs-on: ubuntu-latest
    env:
      CI: 'true'   # SeededCases는 CI에서 시드 덮어쓰기를 무시한다
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Docker available
        run: docker info --format '{{.ServerVersion}}'

      - name: net.jqwik must not appear in any dependency graph (CLAUDE.md 절대 규칙 9)
        run: |
          ./gradlew allDependencies --console=plain > deps.txt
          if grep -q 'net\.jqwik' deps.txt; then echo 'net.jqwik found'; exit 1; fi

      - name: Build (unit + archTest + integrationTest + checksums)
        run: ./gradlew build --console=plain

      - name: C11 — publish platform modules and compile disclosure-domain against published artifacts only
        run: ./gradlew verifyPublishedPlatform --console=plain

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            disclosure-web/build/reports/vitest/**

  e2e:
    # Phase 7 계획 ⑦·Q12: 화면 E2E(Playwright Chromium 데스크톱·모바일) — 부트 jar + 격리 컨테이너(PostgreSQL·SeaweedFS digest 고정).
    # Docker가 없으면 실패한다(스킵 없음). 아티팩트: JUnit·산출물 스캔·누출 스캔·재전송·axe 요약(Phase 8: HTML 리포트 없음 — 단계 제목이 입력값을 싣는다).
    # server.log·seed.log는 올리지 않는다(데모 링크 토큰).
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Docker available
        run: docker info --format '{{.ServerVersion}}'

      - name: E2E (G4·G5·G9·G10·G11)
        run: ./gradlew :disclosure-web:e2e --console=plain

      - name: E2E reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          # Phase 8: HTML 보고서는 만들지 않는다 — 단계 제목이 입력값을 싣는다(키보드 API의 'Type "<값>"'). 산출물 전체는 run.mjs가 센티널로 스캔한다
          path: |
            disclosure-web/build/e2e/junit.xml
            disclosure-web/build/e2e/artifact-scan.json
            disclosure-web/build/e2e/*-summary.json
            disclosure-web/build/e2e/leak-scan/**
            disclosure-web/build/e2e/axe/**

  images:
    # Phase 8 ③·G3: 배포 이미지 2개(app·web)를 만들고 — 웹 헤더 = 데모 서빙 문자열, app이 비루트·읽기 전용 루트로 db migrate, 모든 레이어의 모든 파일
    # 스캔(키 파일 이름·PEM 개인키 블록·데모 고객 센티널). 베이스는 다중 아키텍처 digest라 러너(amd64)와 로컬(arm64)이 같은 고정 값을 쓴다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Docker available
        run: docker info --format '{{.ServerVersion}}'

      - name: Images (build + header/runtime tests + layer scan)
        run: ./gradlew :disclosure-app:imageTest --console=plain

      - name: Image test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-test-reports
          path: disclosure-app/build/test-results/imageTest/**

  pdfa-verify:
    # 3B S12: 골든 PDF를 veraPDF(PDF/A-2b 프로파일)로 검증한다 — 실패 규칙 1건 이상이면 잡 실패. veraPDF는 GPL-3.0/MPL-2.0이라
    # 메인 의존성에 넣지 않고 독립 빌드(verification/pdfa-verify)로 돌린다. 골든 PDF는 메인 빌드가 커밋된 골든 입력에서 렌더한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

      - name: Render golden PDFs (main build, committed golden inputs)
        run: ./gradlew :disclosure-seal:renderGolden --console=plain

      - name: veraPDF PDF/A-2b — 0 failed checks
        run: ./gradlew --project-dir verification/pdfa-verify run --console=plain --args="$GITHUB_WORKSPACE/disclosure-seal/build/golden"

      - name: Golden PDFs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-pdfs
          path: disclosure-seal/build/golden/*.pdf

  no-docker:
    # CLAUDE.md: Docker가 없으면 통합 테스트는 스킵이 아니라 실패해야 한다. 이 잡은 "실패해야 성공"이다(Phase 1 선행 소과제 C).
    # 지시문의 `container:` 방식은 쓰지 않는다 — GitHub Actions는 컨테이너 잡에 호스트의 /var/run/docker.sock을 마운트하므로
    # Docker가 사라지지 않는다(첫 실행에서 확인, 보고서 기록). 대신 호스트 러너에서 Docker 데몬을 멈추고 소켓을 지운다.
    # 성공 조건: Gradle 종료 코드 ≠ 0, Testcontainers의 Docker 미발견 오류, 스킵 0건, 실패한 스위트 ≥ 1.
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Stop Docker and remove its socket
        run: |
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo rm -f /var/run/docker.sock
          if docker info > /dev/null 2>&1; then echo 'Docker is still reachable'; exit 1; fi
          test ! -S /var/run/docker.sock
          echo 'Docker is unavailable'

      - name: disclosure-infra integrationTest must FAIL without Docker
        shell: bash
        run: |
          set +e
          ./gradlew :disclosure-infra:integrationTest --no-daemon --console=plain > it.log 2>&1
          code=$?
          set -e
          echo "gradle exit code: $code"
          tail -n 80 it.log
          if [ "$code" -eq 0 ]; then echo 'FAIL: integrationTest passed without Docker'; exit 1; fi
          if ! grep -q 'Could not find a valid Docker environment' it.log; then echo 'FAIL: no Testcontainers Docker-missing error in the log'; exit 1; fi
          results=$(ls disclosure-infra/build/test-results/integrationTest/*.xml 2>/dev/null | wc -l)
          if [ "$results" -eq 0 ]; then echo 'FAIL: no test results — the tests did not run'; exit 1; fi
          if grep -h -o 'skipped="[0-9]*"' disclosure-infra/build/test-results/integrationTest/*.xml | grep -v -q 'skipped="0"'; then
            echo 'FAIL: some integration tests were skipped'; exit 1
          fi
          failed=$(grep -l -E '(failures|errors)="[1-9]' disclosure-infra/build/test-results/integrationTest/*.xml | wc -l)
          echo "result files: $results, with failures/errors: $failed, skipped: 0"
          if [ "$failed" -eq 0 ]; then echo 'FAIL: no failing test suite'; exit 1; fi
          echo 'OK: integration tests failed (not skipped) because Docker is missing'

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: no-docker-log
          path: |
            it.log
            disclosure-infra/build/test-results/integrationTest/*.xml
