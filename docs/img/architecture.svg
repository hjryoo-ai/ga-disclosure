<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <!-- ga-disclosure 아키텍처(손으로 쓴 SVG — 이 파일이 텍스트 원본이다). 모듈·경계·외부 의존. 정본 설명: docs/ARCHITECTURE.md -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #444; stroke-width: 1.2; }
      .ext { fill: #f3f3f3; stroke: #777; stroke-width: 1.2; stroke-dasharray: 5 3; }
      .zone { fill: #f7f9fc; stroke: #9aa7b8; stroke-width: 1; }
      .mod { fill: #eef4ee; stroke: #5d7f5d; stroke-width: 1; }
      .t { fill: #111; }
      .s { fill: #555; font-size: 11px; }
      .h { fill: #222; font-weight: bold; }
      .l { stroke: #444; stroke-width: 1.2; fill: none; marker-end: url(#a); }
      .d { stroke: #777; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; marker-end: url(#a); }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="700" fill="#ffffff"/>

  <!-- 사용자 -->
  <rect class="box" x="30" y="20" width="220" height="46" rx="6"/>
  <text class="t" x="140" y="40" text-anchor="middle">설계사 · 관리자 · 준법</text>
  <text class="s" x="140" y="57" text-anchor="middle">직원 화면(브라우저)</text>
  <rect class="box" x="290" y="20" width="180" height="46" rx="6"/>
  <text class="t" x="380" y="40" text-anchor="middle">고객</text>
  <text class="s" x="380" y="57" text-anchor="middle">서명 화면(브라우저)</text>
  <rect class="box" x="640" y="20" width="290" height="46" rx="6"/>
  <text class="t" x="785" y="40" text-anchor="middle">서비스 주체</text>
  <text class="s" x="785" y="57" text-anchor="middle">스케줄러 · 청약 시스템 · 이벤트 피드 소비자</text>

  <!-- 클러스터 -->
  <rect class="zone" x="20" y="90" width="920" height="450" rx="8"/>
  <text class="h" x="34" y="110">Kubernetes(kind 데모 · 운영 오버레이 — deploy/)</text>

  <rect class="box" x="40" y="122" width="440" height="50" rx="6"/>
  <text class="t" x="260" y="142" text-anchor="middle">Traefik 공개 진입점(ga-ingress)</text>
  <text class="s" x="260" y="160" text-anchor="middle">A 직원 호스트 /api · 화면   B 서명 호스트 /public · /s   — IP 한도 · 크기 한도</text>
  <rect class="box" x="640" y="122" width="280" height="50" rx="6"/>
  <text class="t" x="780" y="142" text-anchor="middle">Traefik 내부 진입점(C)</text>
  <text class="s" x="780" y="160" text-anchor="middle">/internal — mTLS 필수, 클러스터 안만</text>

  <path class="l" d="M140,66 L140,122"/>
  <path class="l" d="M380,66 L380,122"/>
  <path class="l" d="M785,66 L785,122"/>

  <rect class="box" x="40" y="200" width="150" height="56" rx="6"/>
  <text class="t" x="115" y="222" text-anchor="middle">ga-web</text>
  <text class="s" x="115" y="240" text-anchor="middle">nginx 정적 화면</text>
  <path class="l" d="M115,172 L115,200"/>

  <!-- 앱 -->
  <rect class="box" x="220" y="200" width="700" height="250" rx="6"/>
  <text class="h" x="236" y="220">ga-app(Spring Boot) — 포트 8080 /api·/public · 8081 /internal · 8082 헬스·미터</text>
  <path class="l" d="M330,172 L330,200"/>
  <path class="l" d="M780,172 L780,200"/>

  <rect class="mod" x="240" y="232" width="660" height="30" rx="4"/>
  <text class="t" x="570" y="252" text-anchor="middle">disclosure-app(조립 · 운영자 CLI · 헬스)  →  disclosure-api(컨트롤러 · JWT · 테넌트 바인딩)</text>
  <rect class="mod" x="240" y="270" width="660" height="30" rx="4"/>
  <text class="t" x="570" y="290" text-anchor="middle">disclosure-workflow(유스케이스) · disclosure-compliance(룰 거버넌스 · 준법)</text>
  <rect class="mod" x="240" y="308" width="660" height="30" rx="4"/>
  <text class="t" x="570" y="328" text-anchor="middle">disclosure-rules · disclosure-seal(JCS · 체인 · PDF/A) · disclosure-sign · disclosure-audit(체인 · 앵커 · verify)</text>
  <rect class="mod" x="240" y="346" width="660" height="30" rx="4"/>
  <text class="t" x="570" y="366" text-anchor="middle">disclosure-domain  →  platform-core · platform-canonical(Spring · DB 무의존)</text>
  <rect class="mod" x="240" y="384" width="660" height="30" rx="4"/>
  <text class="t" x="570" y="404" text-anchor="middle">disclosure-infra(Flyway · 저장소 · 컬럼 암호화 · 엔진 · S3 · TSA) · platform-spring(TenantScopedRepository)</text>
  <text class="s" x="570" y="436" text-anchor="middle">위 네 줄은 위에서 아래로 의존, infra는 workflow의 포트를 구현(app만 의존) — Gradle 의존 + ArchUnit. 수수료율 연산 0</text>

  <rect class="box" x="40" y="290" width="160" height="96" rx="6"/>
  <text class="t" x="120" y="312" text-anchor="middle">CronJob 15종</text>
  <text class="t" x="120" y="330" text-anchor="middle">백업 · 마이그레이션 Job</text>
  <text class="s" x="120" y="350" text-anchor="middle">app 이미지의 CLI</text>
  <text class="s" x="120" y="366" text-anchor="middle">KST · Forbid + 앱 잠금</text>

  <!-- 외부 의존 -->
  <rect class="ext" x="30" y="570" width="170" height="56" rx="6"/>
  <text class="t" x="115" y="592" text-anchor="middle">PostgreSQL 18</text>
  <text class="s" x="115" y="610" text-anchor="middle">RLS · 불변 트리거 · 롤 9종</text>
  <rect class="ext" x="215" y="570" width="170" height="56" rx="6"/>
  <text class="t" x="300" y="592" text-anchor="middle">S3 호환 저장소</text>
  <text class="s" x="300" y="610" text-anchor="middle">Object Lock(COMPLIANCE)</text>
  <rect class="ext" x="400" y="570" width="170" height="56" rx="6"/>
  <text class="t" x="485" y="592" text-anchor="middle">ga-commission-engine</text>
  <text class="s" x="485" y="610" text-anchor="middle">등급 · 순위 산출(별도 저장소)</text>
  <rect class="ext" x="585" y="570" width="110" height="56" rx="6"/>
  <text class="t" x="640" y="592" text-anchor="middle">TSA</text>
  <text class="s" x="640" y="610" text-anchor="middle">RFC 3161</text>
  <rect class="ext" x="710" y="570" width="100" height="56" rx="6"/>
  <text class="t" x="760" y="592" text-anchor="middle">IdP</text>
  <text class="s" x="760" y="610" text-anchor="middle">OIDC JWKS</text>
  <rect class="ext" x="825" y="570" width="115" height="56" rx="6"/>
  <text class="t" x="882" y="592" text-anchor="middle">비밀 저장소</text>
  <text class="s" x="882" y="610" text-anchor="middle">ESO → Secret</text>

  <path class="l" d="M300,450 L150,570"/>
  <path class="l" d="M400,450 L300,570"/>
  <path class="l" d="M520,450 L485,570"/>
  <path class="l" d="M640,450 L640,570"/>
  <path class="l" d="M760,450 L760,570"/>
  <path class="d" d="M882,570 L860,450"/>
  <path class="l" d="M100,386 L100,570"/>

  <text class="s" x="30" y="660">점선 상자 = 외부 의존. kind 데모는 PostgreSQL · SeaweedFS를 클러스터 안에 두고, 엔진 · TSA는 앱 안 스텁, IdP는 데모 OIDC 발급자, 비밀은 kind Secret이다.</text>
  <text class="s" x="30" y="680">실 TSA · 통지 사업자 · IdP · 비밀 저장소 연동은 인터페이스 · 문서 · 로컬 어댑터까지다(README "알려진 한계").</text>
</svg>
