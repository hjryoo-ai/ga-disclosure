# 로컬 개발용. PostgreSQL 18 + 롤 초기화(init-roles.sql), 봉인 산출물 저장소 SeaweedFS(S3 호환 + Object Lock, Phase 3B).
# 애플리케이션은 disclosure_app(RLS 대상)으로, Flyway는 disclosure_migrator(소유자)로 접속한다(application.yaml).
# SeaweedFS 이미지는 태그가 아니라 digest로 고정한다(태그는 사라질 수 있다 — 3B 계획 승인 Q1). S3 인증을 켜고 허구 키를 쓴다
# (docker/seaweedfs/s3.json = application.yaml 기본값). 버킷은 앱이 처음 쓸 때 Object Lock 활성으로 만든다(GA_S3_CREATE_BUCKET=true, 로컬 전용).
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: disclosure
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # 로컬 전용
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d disclosure"]
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d   # 4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
    volumes:
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweed:/data

volumes:
  pgdata:
  seaweed:
