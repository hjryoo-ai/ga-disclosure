openapi: 3.1.0
info:
  title: ga-commission-engine — 비교설명 확인서용 판매수수료 등급·순위 API
  version: 1.2.0
  description: |
    설계서 §4.1. 서버 구현은 ga-commission-engine 저장소 Phase E3, 소비자는 ga-disclosure(disclosure-infra 엔진 클라이언트, Phase 3).
    - 등급은 유사상품군 전체 대비, 순위는 요청 세트 안에서 매긴다(1순위가 가장 저렴).
    - gradeOrdinal은 엔진 정책 데이터가 정하는 정수(수수료가 낮을수록 작다). 소비자는 등급 코드의 의미·개수를 모른다.
    - ratioToAvg는 표시·보관용 불투명 문자열이다. 소비자는 숫자로 바꾸거나 비교하지 않는다.
    - 수수료율 원 수치는 응답에 없다. 필요 시 snapshotId로 엔진에서 준법 권한자가 조회한다.
    - results[]는 status로 분기한다. OK는 등급·순위·비율 6개 필드 필수, UNAVAILABLE은 reason만 — 6개 필드는 null이 아니라 부재(additionalProperties: false).
      순위는 OK 항목만으로 매긴다. tieBreak=STRICT면 OK 항목 m개의 rankInSet이 1..m 순열, SHARED_RANK면 경쟁 순위(1-2-2-4)이고 동순위 항목은 전부 tie=true.
    - ratioToAvg 불변 약속: 엔진은 snapshotId별 결과를 영속 저장하고, 같은 snapshotId 재조회 시 ratioToAvg를 포함한 모든 문자열 필드를
      바이트 단위로 동일하게 돌려준다(정책 버전이 바뀌어도 재포맷하지 않음). provider 계약 테스트로 고정한다(설계서 §4.1).
    - 1.1.0(Phase E3 계획, 추가만): 401(토큰)·403(테넌트 불일치) 응답, POST 422(정책 0건·자기 검증 실패 — 500이 아니라 스냅샷 미발급 명시 오류).
    - 1.2.0(ga-disclosure Phase 3A 선행 A, 2026-09-30):
      상품 키 규칙 — productKey ≤ 40자 `{insurerCode}:{code}`(보험사 코드 ≤ 8, 하이픈 허용 / 상품 코드 ≤ 31, 첫 글자 영숫자), insurerCode 같은 규칙.
      요청을 좁히는 변경이지만 40자를 넘는 키의 생산자가 없다(엔진 원장 상품 키 40자).
      임시등록 상품은 요청하지 않는다 — 소비자가 로컬에서 UNAVAILABLE(TEMP_PRODUCT, source=LOCAL)로 표기하고, 응답 집합 = 요청 집합 검사는 요청한 항목에만 적용한다.
      오류 코드 추가(엔진 E3 요청 1~3): POST 400 AS_OF_IN_FUTURE·UNKNOWN_PRODUCT_GROUP, POST 422 INVALID_POLICY, GET 500 SNAPSHOT_INTEGRITY.
      GET 403 설명 변경(엔진 E3 요청 4, E3 심사 §3-3): 토큰은 유효하나 인가 거부. 다른 테넌트의 스냅샷은 404. 응답 형태는 그대로.
servers:
  - url: https://engine.{tenant}.internal
    variables:
      tenant:
        default: t1
paths:
  /internal/v1/disclosure/commission-grades:
    post:
      operationId: computeCommissionGrades
      summary: 요청 상품 세트의 판매수수료 등급·순위 산출(동기, 스냅샷 발급)
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionGradesRequest'
            example:
              tenantId: T1
              asOfDate: '2026-09-23'
              productGroupCode: PG-HEALTH-SIMPLE-NR
              products:
                - { productKey: 'INS-A:PRD-1001', insurerCode: INS-A }
                - { productKey: 'INS-B:PRD-2044', insurerCode: INS-B }
                - { productKey: 'INS-C:PRD-3120', insurerCode: INS-C }
                - { productKey: 'INS-D:PRD-4410', insurerCode: INS-D }
      responses:
        '200':
          description: 산출 결과 스냅샷
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionGradesResponse'
              example:
                snapshotId: GRD-20260923-000481
                gradingPolicyVersionId: GRADING-2026-07
                rankingPolicyVersionId: RANK-2026-07
                tieBreak: SHARED_RANK
                basis: { groupAvgSource: ASSOC_DISCLOSURE, period: 2026Q2, groupPopulation: 27 }
                results:
                  - { productKey: 'INS-A:PRD-1001', status: OK, ratioToAvg: '0.84', grade: LOW, gradeLabel: 낮음, gradeOrdinal: 2, rankInSet: 1, tie: false }
                  - { productKey: 'INS-C:PRD-3120', status: OK, ratioToAvg: '1.02', grade: MID, gradeLabel: 보통, gradeOrdinal: 3, rankInSet: 2, tie: false }
                  - { productKey: 'INS-B:PRD-2044', status: OK, ratioToAvg: '1.37', grade: VERY_HIGH, gradeLabel: 매우높음, gradeOrdinal: 5, rankInSet: 3, tie: false }
                  - { productKey: 'INS-D:PRD-4410', status: UNAVAILABLE, reason: NO_RATE_DATA }
                generatedAt: '2026-09-23T10:15:30+09:00'
        '400':
          description: '요청 오류 — 형식 위반(상품 키 규칙 포함)·상품군·기준일 누락 등. code=AS_OF_IN_FUTURE: 기준일이 엔진의 오늘보다 뒤 / UNKNOWN_PRODUCT_GROUP: 엔진이 모르는 상품군 코드'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 기준일에 적용할 정책 버전이 모호함(2건 이상 매칭, fail-fast)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '서비스 토큰 없음·불일치(code=UNAUTHENTICATED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '요청 tenantId가 이 엔진 인스턴스의 테넌트와 다름(code=TENANT_MISMATCH) — 엔진은 테넌트별 인스턴스'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: '스냅샷을 만들지 않은 명시 오류(code=NO_POLICY: 기준일에 적용할 정책 0건 / POLICY_SELF_CHECK_FAILED: 순위-등급 자기 검증 실패, 정책 데이터 모순 신호 / INVALID_POLICY: 정책 데이터 결함)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
  /internal/v1/disclosure/commission-grades/{snapshotId}:
    get:
      operationId: getCommissionGradesSnapshot
      summary: 발급된 스냅샷 재조회(바이트 동일 — ratioToAvg 불변 약속)
      description: POST가 반환한 것과 같은 응답을 돌려준다. 문자열 필드는 바이트 단위로 동일하며 정책 변경 후에도 재포맷하지 않는다.
      security:
        - serviceToken: []
      parameters:
        - { name: snapshotId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 스냅샷(발급 시점 응답과 동일)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionGradesResponse'
        '404':
          description: 해당 테넌트에 없는 snapshotId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: '서비스 토큰 없음·불일치(code=UNAUTHENTICATED)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: '토큰은 유효하나 인가 거부(역할 없음). 다른 테넌트의 스냅샷은 403이 아니라 404(GET에는 테넌트 입력이 없다)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: '저장된 스냅샷 원문의 해시가 맞지 않음(code=SNAPSHOT_INTEGRITY) — 엔진은 손상된 원문을 반환하지 않는다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: 서비스 간 토큰(운영은 mTLS 병행, 설계서 §9)
  schemas:
    InsurerCode:
      type: string
      maxLength: 8
      pattern: '^[A-Z0-9][A-Z0-9-]{0,7}$'
      description: 보험사 코드(외부 코드 체계). 대문자·숫자로 시작, 대문자·숫자·하이픈, 8자 이하
    ProductKey:
      type: string
      maxLength: 40
      pattern: '^[A-Z0-9][A-Z0-9-]{0,7}:[A-Za-z0-9][A-Za-z0-9._-]{0,30}$'
      description: '{insurerCode}:{상품 코드}. 상품 코드는 영숫자로 시작, 영숫자·점·밑줄·하이픈, 31자 이하. 전체 40자 이하(엔진 원장 상품 키 폭)'
    CommissionGradesRequest:
      type: object
      required: [tenantId, asOfDate, productGroupCode, products]
      properties:
        tenantId: { type: string, pattern: '^[A-Z0-9][A-Z0-9_]{0,31}$' }
        asOfDate: { type: string, format: date, description: '기준일 = 상담일(consult_date)' }
        productGroupCode: { type: string, description: '유사상품군(외부 코드 체계, 설계서 §14 #1)' }
        products:
          type: array
          minItems: 1
          items:
            type: object
            required: [productKey, insurerCode]
            properties:
              productKey: { $ref: '#/components/schemas/ProductKey' }
              insurerCode: { $ref: '#/components/schemas/InsurerCode' }
    CommissionGradesResponse:
      type: object
      required: [snapshotId, gradingPolicyVersionId, rankingPolicyVersionId, tieBreak, basis, results, generatedAt]
      properties:
        snapshotId: { type: string }
        gradingPolicyVersionId: { type: string, description: '등급 임계치·모수·기간 정의 버전' }
        rankingPolicyVersionId: { type: string, description: '세트 내 순위·동점 규칙 버전' }
        tieBreak:
          type: string
          enum: [SHARED_RANK, STRICT]
          description: 'rankingPolicy가 정한 동점 처리. SHARED_RANK = 동순위 병기(1-2-2-4), STRICT = 정책의 2차 기준으로 분리(1..m 유일)'
        basis:
          type: object
          required: [groupAvgSource, period, groupPopulation]
          properties:
            groupAvgSource: { type: string, enum: [ASSOC_DISCLOSURE, ENGINE_LEDGER] }
            period: { type: string }
            groupPopulation: { type: integer, minimum: 0 }
        results:
          type: array
          items:
            $ref: '#/components/schemas/GradeResult'
        generatedAt: { type: string, format: date-time }
    GradeResult:
      oneOf:
        - $ref: '#/components/schemas/GradeResultOk'
        - $ref: '#/components/schemas/GradeResultUnavailable'
      discriminator:
        propertyName: status
        mapping:
          OK: '#/components/schemas/GradeResultOk'
          UNAVAILABLE: '#/components/schemas/GradeResultUnavailable'
    GradeResultOk:
      type: object
      additionalProperties: false
      required: [productKey, status, ratioToAvg, grade, gradeLabel, gradeOrdinal, rankInSet, tie]
      properties:
        productKey: { $ref: '#/components/schemas/ProductKey' }
        status: { const: OK }
        ratioToAvg:
          type: string
          description: 유사상품군 평균 대비 비율. 불투명 문자열 — 소비자는 숫자 변환·비교·정규화하지 않는다.
        grade: { type: string, description: '등급 코드(엔진 정책 데이터)' }
        gradeLabel: { type: string, description: '인쇄용 라벨' }
        gradeOrdinal: { type: integer, minimum: 1, description: '수수료가 낮을수록 작은 정수(정책 데이터)' }
        rankInSet: { type: integer, minimum: 1, description: '요청 세트 내 순위(1순위가 가장 저렴)' }
        tie: { type: boolean, description: '동점 여부(표기는 rankingPolicy 데이터)' }
    GradeResultUnavailable:
      type: object
      additionalProperties: false
      description: 등급·순위·비율 필드는 null이 아니라 부재다.
      required: [productKey, status, reason]
      properties:
        productKey: { $ref: '#/components/schemas/ProductKey' }
        status: { const: UNAVAILABLE }
        reason: { type: string, minLength: 1, description: '산출 불가 사유(엔진 데이터, 예: NO_RATE_DATA·NOT_IN_GROUP). 소비자는 문자열로 보관·표시만 한다. 임시등록 상품은 요청에 오지 않으므로 엔진은 TEMP_PRODUCT를 내지 않는다(소비자 로컬 표기)' }
    Problem:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
