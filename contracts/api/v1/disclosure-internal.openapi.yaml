openapi: 3.1.0
info:
  title: ga-disclosure — 서비스 주체 API(작업·이벤트 피드·청약 게이트·계약 연결)
  version: 4.1.0
  description: |
    설계서 §4.4·§4.5·§7, 6A 계획 §4. 접두 `/internal/v1`은 서비스 주체(SCHEDULER·FEED_CONSUMER·(6B) CONTRACT_FEED·GATE_CLIENT) — 사람 역할은 404(승인 Q15).
    클러스터 밖에 열지 않는다. 인증은 `/api`와 같은 JWT 체인(역할은 `identity_link`). 오류·멱등·커서 규약은 `disclosure-api.openapi.yaml`과 같다.
    본 시스템은 답만 하고, 청약 진행을 막는 것은 호출자다(D-8). (4.0.0) 게이트는 `POST /internal/v1/gate` — 옛 GET stub을 없앴다(경로 제거라 메이저).
servers:
  - url: https://disclosure.internal
paths:
  /internal/v1/gate:
    post:
      operationId: checkSubscriptionGate
      summary: >-
        (4.0.0, 6B) 청약 게이트 — 게이트 서비스 주체(GATE_CLIENT)만, 그 밖은 없는 라우트와 같은 404. 식별자는 본문으로(액세스 로그·질의 문자열에 남지 않게).
        후보는 계약 연결과 같은 규칙(무효·정정·폐기·파기된 확인서는 후보가 아니다 — 무효 확인서가 쥔 연결은 근거가 아니다), 판정은 Phase 4 GateFunction
        그대로(고정 룰의 signerSet·gateRequiresManager). 요청마다 감사 1행(식별자는 해시), 응답에 개인정보 없음. 질의라 Idempotency-Key를 받지 않고
        재생하지 않는다. 주체별 분당 한도(룰 gate.perMinutePerPrincipal) 초과는 429 RATE_LIMITED(감사 없음). 설정 ga.api.client-cert.subject-header가
        있으면 그 헤더(인그레스가 넣은 mTLS 주체)가 토큰 주체와 같아야 한다(다르면 404). 옛 GET /internal/v1/disclosures/gate(미구현 stub)는 없앴다.
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GateRequest' }
            example: { applicationNo: APP-2026-0001, customerRef: CR-0123456789abcdef0123456789abcdef }
      responses:
        '200':
          description: 판정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateDecision' }
              example: { decision: BLOCKED, reason: PENDING, disclosureNo: T1-2026-000481, pendingRoles: [MANAGER], ruleVersionId: DISC-2026-07 }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/contract-links:
    post:
      operationId: importContractLinks
      summary: >-
        (6B) 계약 연결 배치(서비스 주체 CONTRACT_FEED) — 본문은 계약 contracts/contract-link/v1/contract-link-batch.schema.json. 인가 뒤 해석하며 스키마
        위반은 400 MALFORMED_REQUEST(위치를 싣지 않는다). 통과하면 202 + 작업 CONTRACT_LINK_IMPORT(작업 행에는 번호 없는 요약만). 매칭·결과는 작업
        보고서(준법 열람). 옛 `POST /internal/v1/disclosures/{no}/policy-link`는 없앴다(6B 계획 Q3 — 단건은 항목 1개짜리 배치).
        (3.1.0) 배치의 source가 주체의 출처 목록(identity_link.feed_sources) 밖이면 없는 라우트와 같은 404. 같은 source·batchId로 이미 받은 배치와
        내용(JCS 해시)이 다르면 작업 없이 422 REJECTED(code BATCH_REF_REUSED), 같으면 202(재생 — 보고서 replayed).
      security:
        - bearerJwt: []
      parameters:
        - $ref: 'disclosure-api.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: 'contracts/contract-link/v1/contract-link-batch.schema.json' }
            example: { schemaVersion: 1, source: INS_FEED_A, batchId: '2026-10-09.001', items: [ { policyNo: POL-0000000001, contractDate: '2026-09-30', insurerCode: INS-A } ] }
      responses:
        '202':
          description: 접수(비동기 실행) — `Location`이 작업 자원
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: 'disclosure-api.openapi.yaml#/components/schemas/Job' } } }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/events:
    get:
      operationId: getEventFeed
      summary: 아웃박스 이벤트 피드(pull). 포털 알림·CRM이 소비한다.
      description: |
        포털 설계서 v1.1 §4.1 이벤트 피드 규약과 같다(정수 커서 — 6A 승인 Q5). 소비자 문서 `docs/event-feed.md`.
        - 응답 순서는 seq 오름차순, 갭 없음. headSeq − nextSeq가 소비자의 지연 지표.
        - 전달은 at-least-once: `afterSeq`를 생략하면 **ack한 지점**(발행 기록된 마지막 seq, 처음엔 0)부터 준다 — ack 전에 다시 부르면 같은 이벤트를 다시 받는다.
          소비자는 `eventId`로 중복을 거른다.
        - `afterSeq`가 headSeq보다 크면 422 `AFTER_BEYOND_HEAD`(소비자가 다른 발행자 — 예: 복원된 DB — 를 보고 있다. 소비를 멈추고 운영 알림).
        - 인증: JWT(서비스 주체 FEED_CONSUMER — 역할은 `identity_link`). 사람 역할은 404. 테넌트 범위는 토큰의 `tenant_id`(RLS 바인딩).
        - 호환성: 소비자는 모르는 필드를 무시한다. 지원하는 최대 version보다 큰 이벤트를 만나면 그 테넌트의 소비를 정지하고 운영 알림.
        - seq 규칙(소비자): 기대값(last+1)보다 작으면 무시, 같으면 적용, 크면(갭) 정지.
      security:
        - bearerJwt: []
      parameters:
        - { name: afterSeq, in: query, required: false, description: '이 seq 다음부터. 생략하면 ack한 지점부터', schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 100 } }
      responses:
        '200':
          description: seq 오름차순 이벤트 목록
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [events, nextSeq, headSeq, schemaVersion]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '../../events/v1/envelope.schema.json'
                  nextSeq: { type: integer, minimum: 0, description: '다음 호출의 afterSeq(돌려준 마지막 seq, 없으면 시작점)' }
                  headSeq: { type: integer, minimum: 0, description: '발행자의 현재 최대 seq' }
                  schemaVersion: { const: 1 }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/events/ack:
    post:
      operationId: ackEventFeed
      summary: 이 seq까지 처리했다 — 그 이하의 발행 시각을 한 번 기록하고 기본 시작점을 옮긴다
      description: |
        `upToSeq` 이하에서 아직 발행 기록이 없는 이벤트에 발행 시각을 한 번 기록한다(행은 지우지 않는다). 이미 ack한 지점 이하는 아무것도 바꾸지 않는다(200).
        headSeq보다 크면 422 `ACK_BEYOND_HEAD`. 감사 `EVENT_FEED_ACK`. 멱등 키 필수(다른 POST와 같다).
      security:
        - bearerJwt: []
      parameters:
        - $ref: 'disclosure-api.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upToSeq]
              properties:
                upToSeq: { type: integer, minimum: 0 }
            example: { upToSeq: 42 }
      responses:
        '200':
          description: 이제 ack한 지점과 머리
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [ackedSeq, headSeq]
                properties:
                  ackedSeq: { type: integer, minimum: 0, description: '발행 기록된 마지막 seq — afterSeq 생략 시 시작점' }
                  headSeq: { type: integer, minimum: 0 }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/jobs:
    get:
      operationId: listJobsInternal
      summary: 작업 목록(스케줄러)
      parameters:
        - $ref: 'disclosure-api.openapi.yaml#/components/parameters/Limit'
        - $ref: 'disclosure-api.openapi.yaml#/components/parameters/After'
      security:
        - bearerJwt: []
      responses:
        '200':
          description: 목록 한 쪽
          content: { application/json: { schema: { $ref: 'disclosure-api.openapi.yaml#/components/schemas/JobPage' } } }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/jobs/{kind}:
    parameters:
      - $ref: 'disclosure-api.openapi.yaml#/components/parameters/JobKind'
    post:
      operationId: submitJobInternal
      summary: 배치 작업 제출(스케줄러) — 같은 테넌트·같은 종류가 돌고 있으면 409 JOB_ALREADY_RUNNING. ANCHOR는 HTTP에 없다(404). (6B) COLLECTION_RATE_SNAPSHOT은 같은 (달, 룰 버전)이 있으면 작업을 만들지 않고 409 SNAPSHOT_EXISTS.
      security:
        - bearerJwt: []
      parameters:
        - $ref: 'disclosure-api.openapi.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: 'disclosure-api.openapi.yaml#/components/schemas/JobParams' }
            example: { limit: 500 }
      responses:
        '202':
          description: 접수(비동기 실행) — `Location`이 작업 자원
          headers:
            Location: { schema: { type: string } }
          content: { application/json: { schema: { $ref: 'disclosure-api.openapi.yaml#/components/schemas/Job' } } }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/jobs/{jobId}:
    parameters:
      - $ref: 'disclosure-api.openapi.yaml#/components/parameters/JobId'
    get:
      operationId: getJobInternal
      summary: 작업 한 건
      security:
        - bearerJwt: []
      responses:
        '200':
          description: 작업
          content: { application/json: { schema: { $ref: 'disclosure-api.openapi.yaml#/components/schemas/Job' } } }
        default: { $ref: '#/components/responses/Problem' }
  /internal/v1/jobs/{jobId}/report:
    parameters:
      - $ref: 'disclosure-api.openapi.yaml#/components/parameters/JobId'
    get:
      operationId: getJobReportInternal
      summary: 작업 보고서(열람은 준법 칸뿐 — 서비스 주체는 404)
      security:
        - bearerJwt: []
      responses:
        '200':
          description: 보고서 바이트
          content: { application/json: { schema: { type: object } } }
        default: { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: 오류(`disclosure-api.openapi.yaml`의 Problem과 같다 — 4.1.0부터 룰 없는 테넌트의 쓰기 503 `TENANT_RULES_NOT_ACTIVE` 포함)
      content: { application/json: { schema: { $ref: 'disclosure-api.openapi.yaml#/components/schemas/Problem' } } }
  schemas:
    GateRequest:
      type: object
      additionalProperties: false
      required: [customerRef]
      oneOf:
        - { required: [applicationNo] }
        - { required: [policyNo] }
      properties:
        applicationNo: { type: string, pattern: '^\S{1,64}$' }
        policyNo: { type: string, pattern: '^\S{1,64}$' }
        customerRef: { type: string, pattern: '^CR-[0-9a-f]{32}$' }
    GateDecision:
      type: object
      additionalProperties: false
      required: [decision, reason, disclosureNo, pendingRoles, ruleVersionId]
      description: >-
        ALLOWED는 정확히 SATISFIED. 확인서 번호·룰 버전은 근거 확인서가 있을 때(SATISFIED·PENDING)만 — 고객 불일치·모호·근거 없음은 null. pendingRoles는
        signerSet 순서(gateRequiresManager=false면 SATISFIED여도 MANAGER가 남을 수 있다 — 관리자 확인은 이후에도 완료돼야 한다).
      properties:
        decision: { type: string, enum: [ALLOWED, BLOCKED] }
        reason: { type: string, enum: [SATISFIED, NO_DISCLOSURE, CUSTOMER_MISMATCH, AMBIGUOUS, PENDING] }
        disclosureNo: { oneOf: [ { type: 'null' }, { $ref: 'disclosure-api.openapi.yaml#/components/schemas/DisclosureNo' } ] }
        pendingRoles: { type: array, items: { type: string, enum: [CUSTOMER, AGENT, MANAGER] } }
        ruleVersionId: { oneOf: [ { type: 'null' }, { $ref: 'disclosure-api.openapi.yaml#/components/schemas/RuleVersionId' } ] }
    Problem:
      $ref: 'disclosure-api.openapi.yaml#/components/schemas/Problem'
